name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: node scripts/verify-version.mjs "${GITHUB_REF_NAME#v}"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - run: pnpm install --frozen-lockfile

      # tauri-action always sends the tag commit as target_commitish, which GitHub rejects
      # for GITHUB_TOKEN with 403; a release created from the existing tag is accepted.
      # The draft also keeps a failed build from leaving a public release without assets.
      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pre-release tags (v1.0.0-rc.1) must not reach the updater's latest.json.
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo true || echo false)
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Winget Updater $GITHUB_REF_NAME" \
            -F draft=true -F prerelease="$prerelease" -F generate_release_notes=true)
          echo "id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$delimiter"
            jq -r .body <<<"$release"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # With a release id the action only uploads; it never creates the release itself.
          releaseId: ${{ steps.draft.outputs.id }}
          # Becomes the "notes" of latest.json, shown in the app's update notice.
          releaseBody: ${{ steps.draft.outputs.body }}
          uploadUpdaterJson: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
