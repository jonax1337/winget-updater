[package]
name = "winget-updater"
version = "0.1.0"
description = "Keeps Windows software up to date across winget, Scoop, Chocolatey, npm, and pip."
authors = ["Jonas Laux"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winget_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-process = "2.4.0"
tokio = { version = "1.53.3", features = ["full"] }
regex = "1.13.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation"] }
winreg = "0.56.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
png = "0.18.1"
ureq = "3.5.0"
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
